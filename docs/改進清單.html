<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Console 改進清單</title>
<style>
:root {
  --bg: #f5f6f8; --surface: #ffffff; --surface-2: #eef0f3; --border: #dde1e6; --border-strong: #c6ccd4;
  --text: #1b1f24; --text-2: #48515d; --muted: #7a8491;
  --accent: #2f6fde; --accent-text: #ffffff; --accent-soft: #e5edfc;
  --on: #eef6ec; --on-line: #4f9a45;
  --e-s: #2e7d4f; --e-m: #a8690f; --e-l: #c0392b; --spike: #7547c9; --gaps: #4a5868;
  --shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 4px 14px rgba(0, 0, 0, .05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131619; --surface: #1b1f24; --surface-2: #242a31; --border: #313841; --border-strong: #434c57;
    --text: #e8ebef; --text-2: #b6bec8; --muted: #8a94a0;
    --accent: #6c9cff; --accent-text: #0d1424; --accent-soft: #1e2a42;
    --on: #18261b; --on-line: #6cc160;
    --e-s: #62c98f; --e-m: #e3ac4b; --e-l: #f07563; --spike: #ab8cf2; --gaps: #9fb0c2;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 14px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131619; --surface: #1b1f24; --surface-2: #242a31; --border: #313841; --border-strong: #434c57;
  --text: #e8ebef; --text-2: #b6bec8; --muted: #8a94a0;
  --accent: #6c9cff; --accent-text: #0d1424; --accent-soft: #1e2a42;
  --on: #18261b; --on-line: #6cc160;
  --e-s: #62c98f; --e-m: #e3ac4b; --e-l: #f07563; --spike: #ab8cf2; --gaps: #9fb0c2;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 14px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.6 system-ui, "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
}
button, input, select, textarea { font: inherit; color: inherit; }
.wrap { width: min(1080px, 100%); margin: 0 auto; padding: 0 16px; }

.top { padding: 28px 0 18px; }
.top h1 { margin: 0 0 6px; font-size: 24px; letter-spacing: .01em; }
.lede { margin: 0 0 12px; color: var(--text-2); max-width: 760px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 0; padding: 0; list-style: none; color: var(--text-2); font-size: 13px; }
.legend li { display: inline-flex; align-items: center; gap: 6px; }

.bar { position: sticky; top: 0; z-index: 10; padding: 10px 0; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.bar-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.bar-row + .bar-row { margin-top: 8px; }
.bar input[type="search"], .bar select {
  height: 36px; padding: 0 10px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px;
}
.bar input[type="search"] { flex: 1 1 220px; min-width: 0; }
.bar select { flex: 0 1 auto; max-width: 100%; }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { height: 34px; padding: 0 12px; background: none; border: 0; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); font-weight: 600; }
.only { display: inline-flex; align-items: center; gap: 6px; height: 36px; cursor: pointer; user-select: none; }
.count { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--text-2); white-space: nowrap; }
.count b { color: var(--text); font-size: 17px; }
.grow { flex: 1; }
.btn {
  height: 34px; padding: 0 12px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px;
  cursor: pointer; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.06); }
.btn:focus-visible, .seg button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.cat { margin: 22px 0 0; }
.cat-head { display: flex; align-items: baseline; gap: 10px; margin: 0 0 8px; }
.cat-head h2 { margin: 0; font-size: 17px; }
.cat-count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.cat-all { margin-left: auto; height: 28px; padding: 0 10px; font-size: 13px; }
.items { display: grid; gap: 6px; }

.item { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); }
.item.on { background: var(--on); border-color: var(--on-line); }
.pick { display: grid; grid-template-columns: 22px 52px 1fr; gap: 10px; align-items: start; padding: 10px 12px; cursor: pointer; }
.pick input { width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--on-line); cursor: pointer; }
.code { padding-top: 1px; color: var(--muted); font: 12.5px/1.6 ui-monospace, Consolas, monospace; }
.t { display: block; font-weight: 600; }
.why { display: block; color: var(--text-2); font-size: 13.5px; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.tag {
  display: inline-block; padding: 0 7px; border-radius: 999px; font-size: 11.5px; line-height: 19px; font-weight: 600;
  color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent); border: 1px solid color-mix(in srgb, var(--c) 30%, transparent);
}
.tag.e-s { --c: var(--e-s); } .tag.e-m { --c: var(--e-m); } .tag.e-l { --c: var(--e-l); }
.tag.spike { --c: var(--spike); } .tag.gaps { --c: var(--gaps); font-weight: 500; }
.extra { display: none; gap: 8px; padding: 0 12px 10px 96px; }
.item.on .extra { display: flex; }
.extra select, .extra input { height: 32px; padding: 0 8px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 7px; }
.extra input { flex: 1; min-width: 0; }

.notes { margin-top: 30px; }
.notes h2 { margin: 0 0 8px; font-size: 17px; }
.notes textarea { width: 100%; padding: 10px 12px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 10px; resize: vertical; }
.empty { padding: 40px 0; color: var(--muted); text-align: center; }
.foot { padding: 20px 16px 40px; color: var(--muted); font-size: 12.5px; }

.toast {
  position: fixed; left: 50%; bottom: 20px; z-index: 20; max-width: calc(100vw - 32px); padding: 10px 16px; border-radius: 10px;
  background: var(--text); color: var(--bg); box-shadow: var(--shadow); transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  transition: opacity .18s, transform .18s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 640px) {
  .top h1 { font-size: 20px; }
  .bar { position: static; }
  .count { margin-left: 0; width: 100%; }
  .pick { grid-template-columns: 22px 1fr; }
  .code { display: none; }
  .extra { flex-wrap: wrap; padding-left: 44px; }
  .extra input { flex-basis: 100%; }
  .grow { display: none; }
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <h1>Video Console 改進清單</h1>
    <p class="lede">共 <b id="total">0</b> 項，依 GAPS.md 尚未補完的落差與實際剪片情境整理。勾選想做的項目，可加優先順序與備註，最後按「複製勾選結果」貼回給 Claude。</p>
    <ul class="legend">
      <li><span class="tag e-s">小</span>半天內</li>
      <li><span class="tag e-m">中</span>1～2 天</li>
      <li><span class="tag e-l">大</span>3 天以上</li>
      <li><span class="tag spike">需先驗證</span>可行性未知，先做小型實驗（PoC）</li>
      <li><span class="tag gaps">GAPS #83</span>對應 GAPS.md 編號</li>
    </ul>
  </div>
</header>

<div class="bar">
  <div class="wrap">
    <div class="bar-row">
      <input id="q" type="search" placeholder="搜尋標題、說明或 GAPS 編號" aria-label="搜尋">
      <select id="cat" aria-label="分類"><option value="">全部分類</option></select>
      <div class="seg" id="effort" role="group" aria-label="工作量">
        <button type="button" data-v="" aria-pressed="true">全部</button>
        <button type="button" data-v="小" aria-pressed="false">小</button>
        <button type="button" data-v="中" aria-pressed="false">中</button>
        <button type="button" data-v="大" aria-pressed="false">大</button>
      </div>
      <label class="only"><input type="checkbox" id="only"> 只看已勾選</label>
      <span class="count" id="count"></span>
    </div>
    <div class="bar-row">
      <button type="button" class="btn" id="selVisible">勾選目前顯示的項目</button>
      <button type="button" class="btn" id="clearAll">清除全部勾選</button>
      <span class="grow"></span>
      <button type="button" class="btn primary" id="copy">複製勾選結果</button>
      <button type="button" class="btn" id="dlTxt">下載 TXT</button>
      <button type="button" class="btn" id="dlJson">下載 JSON</button>
      <button type="button" class="btn" id="theme" aria-label="切換深淺色">深淺色</button>
    </div>
  </div>
</div>

<main class="wrap" id="list"></main>

<section class="wrap notes">
  <h2>整體備註</h2>
  <textarea id="note" rows="4" placeholder="例如：先做音訊類，下週要交片；大項目可以拆兩階段"></textarea>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

const KEY = "vc-improve-2026-10-24";
const THEME_KEY = "vc-improve-theme";
const EFFORT_CLASS = { "小": "e-s", "中": "e-m", "大": "e-l" };

const ITEMS = DATA.flatMap((c) => c.items.map((it, i) => ({
  id: `${c.code}-${String(i + 1).padStart(2, "0")}`,
  cat: c.code,
  catName: c.name,
  title: it[0],
  why: it[1],
  effort: it[2],
  gaps: it[3] ? it[3].split(",").map((n) => `#${n}`) : [],
  spike: Boolean(it[4]),
})));
const BY_ID = new Map(ITEMS.map((it) => [it.id, it]));

const $ = (sel) => document.querySelector(sel);
const esc = (s) => s.replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));

function load() {
  try {
    const saved = JSON.parse(localStorage.getItem(KEY));
    if (saved && typeof saved.picked === "object") return { picked: saved.picked, note: saved.note || "" };
  } catch (err) { /* storage blocked or corrupt: start empty */ }
  return { picked: {}, note: "" };
}

let state = load();
let filter = { q: "", cat: "", effort: "", only: false };

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (err) { /* private window: keep in memory only */ }
}

function setPicked(id, value) {
  const picked = { ...state.picked };
  if (value) picked[id] = value; else delete picked[id];
  state = { ...state, picked };
}

function render() {
  $("#total").textContent = ITEMS.length;
  $("#cat").insertAdjacentHTML("beforeend", DATA.map((c) => `<option value="${c.code}">${esc(c.name)}（${c.items.length}）</option>`).join(""));
  $("#list").innerHTML = DATA.map((c) => `
    <section class="cat" data-cat="${c.code}">
      <div class="cat-head"><h2>${esc(c.name)}</h2><span class="cat-count"></span><button type="button" class="btn cat-all">全選本類</button></div>
      <div class="items">${ITEMS.filter((it) => it.cat === c.code).map(itemHtml).join("")}</div>
    </section>`).join("") + `<p class="empty" hidden>沒有符合條件的項目。</p>`;
  $("#note").value = state.note;
  syncAll();
}

function itemHtml(it) {
  const tags = [`<span class="tag ${EFFORT_CLASS[it.effort]}">${it.effort}</span>`]
    .concat(it.spike ? [`<span class="tag spike">需先驗證</span>`] : [])
    .concat(it.gaps.map((g) => `<span class="tag gaps">GAPS ${g}</span>`));
  return `
    <article class="item" data-id="${it.id}">
      <label class="pick">
        <input type="checkbox" aria-label="${esc(it.title)}">
        <span class="code">${it.id}</span>
        <span class="body">
          <span class="t">${esc(it.title)}</span>
          ${it.why ? `<span class="why">${esc(it.why)}</span>` : ""}
          <span class="tags">${tags.join("")}</span>
        </span>
      </label>
      <div class="extra">
        <select class="pri" aria-label="優先順序">
          <option value="高">優先：高</option><option value="中">優先：中</option><option value="低">優先：低</option>
        </select>
        <input class="memo" type="text" placeholder="備註（選填）" aria-label="備註">
      </div>
    </article>`;
}

function syncItem(el) {
  const pick = state.picked[el.dataset.id];
  el.classList.toggle("on", Boolean(pick));
  el.querySelector("input[type=checkbox]").checked = Boolean(pick);
  if (pick) {
    el.querySelector(".pri").value = pick.p;
    const memo = el.querySelector(".memo");
    if (memo !== document.activeElement) memo.value = pick.n;
  }
}

function matches(it) {
  if (filter.cat && it.cat !== filter.cat) return false;
  if (filter.effort && it.effort !== filter.effort) return false;
  if (filter.only && !state.picked[it.id]) return false;
  if (!filter.q) return true;
  const hay = `${it.id} ${it.title} ${it.why} ${it.catName} ${it.gaps.map((g) => `gaps ${g}`).join(" ")} ${it.spike ? "需先驗證" : ""}`.toLowerCase();
  // "#20" must not also match #200～#212, so GAPS numbers compare exactly.
  return filter.q.split(/\s+/).every((word) => (/^#\d+$/.test(word) ? it.gaps.includes(word) : hay.includes(word)));
}

function syncAll() {
  let shown = 0;
  document.querySelectorAll(".cat").forEach((sec) => {
    let visible = 0;
    let on = 0;
    const items = sec.querySelectorAll(".item");
    items.forEach((el) => {
      syncItem(el);
      const it = BY_ID.get(el.dataset.id);
      const show = matches(it);
      el.hidden = !show;
      if (show) visible += 1;
      if (state.picked[it.id]) on += 1;
    });
    sec.hidden = visible === 0;
    sec.querySelector(".cat-count").textContent = `已勾 ${on}／${items.length}`;
    shown += visible;
  });
  document.querySelector(".empty").hidden = shown > 0;
  const total = Object.keys(state.picked).length;
  $("#count").innerHTML = `已勾選 <b>${total}</b>／${ITEMS.length}　顯示 ${shown} 項`;
}

function pickedList() {
  return ITEMS.filter((it) => state.picked[it.id]).map((it) => ({ ...it, priority: state.picked[it.id].p, note: state.picked[it.id].n }));
}

function asText() {
  const list = pickedList();
  const lines = [`Video Console 改進清單勾選結果（清單版本 2026-10-24）`, `勾選 ${list.length}／${ITEMS.length} 項`, ""];
  DATA.forEach((c) => {
    const rows = list.filter((it) => it.cat === c.code);
    if (!rows.length) return;
    lines.push(`【${c.name}】`);
    rows.forEach((it) => {
      const extras = [`工作量：${it.effort}`, `優先：${it.priority}`]
        .concat(it.spike ? ["需先驗證"] : [])
        .concat(it.gaps.length ? [`GAPS ${it.gaps.join("、")}`] : [])
        .concat(it.note ? [`備註：${it.note}`] : []);
      lines.push(`${it.id} ${it.title}｜${extras.join("｜")}`);
    });
    lines.push("");
  });
  if (state.note.trim()) lines.push("【整體備註】", state.note.trim());
  return lines.join("\n").trim() + "\n";
}

function asJson() {
  return JSON.stringify({
    list: "Video Console 改進清單",
    version: "2026-10-24",
    total: ITEMS.length,
    picked: pickedList().map((it) => ({ id: it.id, category: it.catName, title: it.title, effort: it.effort, spike: it.spike, gaps: it.gaps, priority: it.priority, note: it.note })),
    note: state.note.trim(),
  }, null, 2);
}

let toastTimer = 0;
function toast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}

function nothingPicked() {
  if (Object.keys(state.picked).length) return false;
  toast("還沒有勾選任何項目");
  return true;
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (err) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
    document.body.append(ta);
    ta.select();
    const ok = document.execCommand("copy");
    ta.remove();
    return ok;
  }
}

function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type: `${type};charset=utf-8` }));
  const a = Object.assign(document.createElement("a"), { href: url, download: name });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function applyTheme(theme) {
  if (theme) document.documentElement.dataset.theme = theme;
  else delete document.documentElement.dataset.theme;
}

// Events
$("#list").addEventListener("change", (e) => {
  const el = e.target.closest(".item");
  if (!el) return;
  const id = el.dataset.id;
  if (e.target.type === "checkbox") setPicked(id, e.target.checked ? { p: "中", n: "" } : null);
  else if (e.target.classList.contains("pri")) setPicked(id, { ...state.picked[id], p: e.target.value });
  else return;
  save();
  syncAll();
});

$("#list").addEventListener("input", (e) => {
  if (!e.target.classList.contains("memo")) return;
  const id = e.target.closest(".item").dataset.id;
  setPicked(id, { ...state.picked[id], n: e.target.value });
  save();
});

$("#list").addEventListener("click", (e) => {
  const btn = e.target.closest(".cat-all");
  if (!btn) return;
  const items = [...btn.closest(".cat").querySelectorAll(".item:not([hidden])")];
  const allOn = items.every((el) => state.picked[el.dataset.id]);
  items.forEach((el) => setPicked(el.dataset.id, allOn ? null : (state.picked[el.dataset.id] || { p: "中", n: "" })));
  save();
  syncAll();
});

$("#q").addEventListener("input", (e) => { filter = { ...filter, q: e.target.value.trim().toLowerCase() }; syncAll(); });
$("#cat").addEventListener("change", (e) => { filter = { ...filter, cat: e.target.value }; syncAll(); });
$("#only").addEventListener("change", (e) => { filter = { ...filter, only: e.target.checked }; syncAll(); });
$("#effort").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  document.querySelectorAll("#effort button").forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
  filter = { ...filter, effort: btn.dataset.v };
  syncAll();
});

$("#selVisible").addEventListener("click", () => {
  const visible = [...document.querySelectorAll(".cat:not([hidden]) .item:not([hidden])")];
  visible.forEach((el) => setPicked(el.dataset.id, state.picked[el.dataset.id] || { p: "中", n: "" }));
  save();
  syncAll();
  toast(`已勾選目前顯示的 ${visible.length} 項`);
});

$("#clearAll").addEventListener("click", () => {
  const n = Object.keys(state.picked).length;
  if (!n || !confirm(`確定清除全部 ${n} 項勾選與備註？`)) return;
  state = { ...state, picked: {} };
  save();
  syncAll();
});

$("#note").addEventListener("input", (e) => { state = { ...state, note: e.target.value }; save(); });

$("#copy").addEventListener("click", async () => {
  if (nothingPicked()) return;
  const ok = await copyText(asText());
  toast(ok ? `已複製 ${Object.keys(state.picked).length} 項，貼回給 Claude 即可` : "複製失敗，請改用「下載 TXT」");
});
$("#dlTxt").addEventListener("click", () => { if (!nothingPicked()) download("改進清單勾選結果.txt", asText(), "text/plain"); });
$("#dlJson").addEventListener("click", () => { if (!nothingPicked()) download("改進清單勾選結果.json", asJson(), "application/json"); });

$("#theme").addEventListener("click", () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const current = document.documentElement.dataset.theme || (dark ? "dark" : "light");
  const next = current === "dark" ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem(THEME_KEY, next); } catch (err) { /* ignore */ }
});

try { applyTheme(localStorage.getItem(THEME_KEY)); } catch (err) { /* ignore */ }
render();
</script>
</body>
</html>
